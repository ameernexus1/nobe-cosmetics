<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER category tile (Face Masks) — soft photo stand-in, no caption.
     TODO: replace with a real Face Masks collection photo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Face Masks">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E6CE"/><stop offset="1" stop-color="#E3C79B"/>
    </linearGradient>
    <linearGradient id="m-jar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EFE1"/><stop offset="1" stop-color="#E1C79A"/>
    </linearGradient>
    <filter id="m-soft"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="m-light" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#m-bg)"/>
  <rect width="800" height="800" fill="url(#m-light)"/>
  <g filter="url(#m-soft)">
    <rect x="300" y="410" width="200" height="180" rx="26" fill="url(#m-jar)"/>
    <rect x="288" y="378" width="224" height="50" rx="22" fill="#CDA875"/>
    <ellipse cx="400" cy="470" rx="66" ry="30" fill="#EAD9B4" opacity="0.8"/>
    <!-- soft applicator brush -->
    <rect x="540" y="300" width="20" height="220" rx="10" fill="#B79463" transform="rotate(24 550 410)"/>
    <ellipse cx="600" cy="330" rx="34" ry="20" fill="#E9DCC1" transform="rotate(24 600 330)"/>
    <circle cx="230" cy="270" r="40" fill="#EFD9AE" opacity="0.7"/>
  </g>
</svg>
