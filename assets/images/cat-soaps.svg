<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soaps">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DCE3"/><stop offset="1" stop-color="#E7B4C4"/>
