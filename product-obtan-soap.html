<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Title/description are also updated by main.js; these are SEO fallbacks. -->
  <title>Obtan Soap — Nobe Cosmetics</title>
  <meta name="description" content="Obtan Soap by Nobe Cosmetics — a gentle, natural cleansing bar handmade in Lahore. Order on WhatsApp.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@700;800&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <!-- main.js reads data-product-id and fills in every .pd-* element below -->
  <main data-product-id="obtan-soap">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span class="pd-crumb-name">Obtan Soap</span>
      </nav>

      <div class="pd-layout">
        <div class="pd-gallery fade-in">
          <span class="pd-badge">Bestseller</span>
          <!-- src/alt set by main.js from products.js -->
          <img class="pd-image" src="assets/images/obtan-soap.svg" alt="Obtan Soap" width="800" height="800">
        </div>

        <div class="pd-info fade-in">
          <span class="eyebrow">Soaps</span>
          <h1 class="pd-name">Obtan Soap</h1>
          <p class="pd-price">Price on request</p>
          <p class="pd-desc">Loading product details…</p>

          <div class="pd-actions">
            <a class="btn pd-order" href="#" target="_blank" rel="noopener noreferrer">Order via WhatsApp</a>
            <button class="pd-wish" aria-pressed="false" aria-label="Save for later" title="Save for later">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 21s-6.7-4.35-9.33-8.02C.9 10.3 1.36 7.3 3.5 5.9c1.9-1.24 4.3-.7 5.6.9L12 10l2.9-3.2c1.3-1.6 3.7-2.14 5.6-.9 2.14 1.4 2.6 4.4.83 7.08C18.7 16.65 12 21 12 21z"/></svg>
            </button>
          </div>

          <div class="pd-accordion">
            <details open>
              <summary>Ingredients</summary>
              <div class="acc-body pd-ingredients">Loading…</div>
            </details>
            <details>
              <summary>How to Use</summary>
              <div class="acc-body pd-howto">Loading…</div>
            </details>
          </div>

          <div class="pd-trust">
            <span>🌿 Natural ingredients</span>
            <span>✋ Handmade</span>
            <span>🐇 Cruelty-free</span>
          </div>
        </div>
      </div>

      <p style="margin:28px 0 60px"><a class="btn btn-ghost" href="shop.html">← Back to Shop</a></p>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/products.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
